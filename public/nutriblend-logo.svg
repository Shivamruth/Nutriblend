<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">NutriBlend NB Logo</title>
  <desc id="desc">Gold and purple NutriBlend fitness logo with NB initials.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#17110a"/>
      <stop offset="64%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="gold" x1="17%" y1="10%" x2="86%" y2="92%">
